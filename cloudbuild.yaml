steps:
  # Build and push using Kaniko for fast, natively-supported layer caching
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - '--destination=gcr.io/$PROJECT_ID/indelible:$COMMIT_SHA'
      - '--destination=gcr.io/$PROJECT_ID/indelible:latest'
      - '--cache=true'
      - '--cache-ttl=99h'
      - '--dockerfile=backend/Dockerfile'
      - '--context=dir://.'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'indelible'
      - '--image'
      - 'gcr.io/$PROJECT_ID/indelible:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'

images:
  - 'gcr.io/$PROJECT_ID/indelible:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/indelible:latest'

options:
  logging: CLOUD_LOGGING_ONLY
